<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardlake cards</title>
<!--
  The MCP Apps view (spec 2026-01-26) that Claude, ChatGPT and other hosts
  render for list_feed, search_cards, get_card and create tool results. It is
  served as the ui://cardle/cards.html resource (api/_lib/mcp-app.js). Its look
  follows the feed cards in public/vault/assets/aurora-feed.js and .css.

  Self-contained on purpose: no external scripts, styles, fonts, images or
  network calls, so it runs under the host's strictest default CSP. Card
  text only ever reaches the page through textContent, never as HTML, since
  some of it (GitHub issue titles) comes from outside Cardlake.

  Pin, Like, Remind later and Delete buttons appear when the host can run
  tools for the view (hostCapabilities.serverTools): a click asks the host
  to call pin_card, like_card, snooze_card, a delete tool and their undo
  tools on Cardlake's server, the same tools the model uses. Delete asks on
  the card first, because a deleted card can't be restored from the app;
  the model is told to confirm before deleting, and a button mustn't skip
  that. Hosts that can't get the same cards, read-only.

  A card a create tool just saved offers only Undo, which is that same delete
  without the question: the person is looking at what was saved a moment ago.
  After ten minutes it shows as an ordinary card instead.
-->
<style>
  :root {
    color-scheme: light dark;
    /* Cardlake blue. The accent is darker or lighter than the brand gradient
       so that it stays readable as text on either theme. */
    --cardle-gradient: linear-gradient(135deg, #4a86e9, #42b3e7);
    --cardle-accent: light-dark(#2f6fd6, #7fb0f5);
    /* Fallbacks for the host's standard theme variables (see the MCP Apps
       spec, "Theming"); a host that passes its own overrides these. */
    --color-background-primary: light-dark(#ffffff, #151a21);
    --color-background-secondary: light-dark(#f7f9fc, #1c232c);
    --color-text-primary: light-dark(#17202b, #edf1f6);
    --color-text-secondary: light-dark(#5a6675, #a3afbd);
    --color-border-primary: light-dark(#dde3ea, #2f3945);
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --border-radius-card: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.45 var(--font-sans); color: var(--color-text-primary); padding: 4px; }
  .summary { color: var(--color-text-secondary); font-size: 12px; margin: 0 2px 8px; }
  .cards { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .card {
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-card);
    padding: 14px;
    min-width: 0;
  }
  .saved-note { color: var(--cardle-accent); font-size: 12px; font-weight: 700; margin: 0 0 10px; }
  .top { display: flex; align-items: flex-start; gap: 10px; }
  .tile {
    flex: 0 0 34px; width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 10px; color: #fff; background: var(--cardle-gradient);
  }
  .tile-reminder { background: linear-gradient(135deg, oklch(60% .14 230), oklch(66% .12 212)); }
  .tile-learning { background: linear-gradient(135deg, oklch(52% .17 262), oklch(58% .15 250)); }
  .tile-kanban { background: linear-gradient(135deg, oklch(34% .03 265), oklch(46% .04 265)); }
  .tile-work { background: linear-gradient(135deg, oklch(48% .18 262), oklch(54% .16 255)); }
  .tile-family { background: linear-gradient(135deg, oklch(56% .15 245), oklch(62% .13 232)); }
  .tile-bookmark { background: linear-gradient(135deg, oklch(50% .16 258), oklch(56% .14 245)); }
  .tile-talking_point { background: linear-gradient(135deg, oklch(54% .16 250), oklch(60% .14 238)); }
  .tile-file { background: linear-gradient(135deg, oklch(62% .12 215), oklch(68% .1 200)); }
  .heading { min-width: 0; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 2px; }
  .type { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-secondary); overflow-wrap: anywhere; }
  .badge { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--color-border-primary); color: var(--color-text-secondary); }
  .title { font-size: 15px; font-weight: 700; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  .added { color: var(--color-text-secondary); font-size: 11.5px; margin: 3px 0 0; }
  .body { font-size: 13px; line-height: 1.5; color: var(--color-text-secondary); margin: 9px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .open {
    margin-top: 8px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    color: var(--cardle-accent); background: none; border: 0; padding: 0;
  }
  .open:hover, .open:focus-visible { text-decoration: underline; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  .actions .open { margin-top: 0; margin-left: auto; }
  .action {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 12px; border-radius: 999px;
    color: var(--color-text-primary); background: var(--color-background-primary); border: 1px solid var(--color-border-primary);
  }
  .action:hover:not(:disabled) { border-color: var(--cardle-accent); }
  .action:focus-visible { outline: 2px solid var(--cardle-accent); outline-offset: 2px; }
  .action[aria-pressed="true"] { color: var(--cardle-accent); border-color: var(--cardle-accent); }
  .action:disabled { opacity: .55; cursor: default; }
  .action.danger { color: light-dark(#b42840, #ff8a99); border-color: currentColor; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  .prompt { color: var(--color-text-secondary); font-size: 12px; }
  .checklist { margin: 9px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
  .checklist li { overflow-wrap: anywhere; }
  .checklist li[data-done="true"] { color: var(--color-text-secondary); text-decoration: line-through; }
  .notice { color: var(--color-text-secondary); font-size: 12px; margin: 6px 0 0; }
  .empty { color: var(--color-text-secondary); margin: 4px 2px; }
  .footer { margin: 10px 2px 0; }
</style>
</head>
<body>
<main id="root" aria-live="polite"><p class="empty">Loading cards…</p></main>
<script>
(() => {
  'use strict';
  const PROTOCOL_VERSION = '2026-01-26';
  const CARDLE_URL = '__CARDLE_ORIGIN__/';
  const BODY_LIMIT = 280;
  const TYPE_LABELS = {
    reminder: 'Reminder', learning: 'Learning', kanban: 'GitHub issue', work: 'Work item',
    family: 'Family', bookmark: 'Bookmark', talking_point: 'Misc', file: 'File',
  };
  // The feed's icon for each card type (ICONS in aurora-feed.js), as path data.
  const TYPE_ICONS = {
    reminder: ['M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9', 'M10.3 21a1.94 1.94 0 0 0 3.4 0'],
    learning: ['M2 4h7a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z', 'M22 4h-7a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h8z'],
    work: ['M5 7h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z', 'M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2', 'M3 13h18'],
    family: ['M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', 'M23 21v-2a4 4 0 0 0-3-3.87', 'M16 3.13a4 4 0 0 1 0 7.75'],
    bookmark: ['M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z'],
    talking_point: ['M4.5 3h4A1.5 1.5 0 0 1 10 4.5v4A1.5 1.5 0 0 1 8.5 10h-4A1.5 1.5 0 0 1 3 8.5v-4A1.5 1.5 0 0 1 4.5 3z', 'M15.5 3h4A1.5 1.5 0 0 1 21 4.5v4a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 14 8.5v-4A1.5 1.5 0 0 1 15.5 3z', 'M4.5 14h4a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 8.5 21h-4A1.5 1.5 0 0 1 3 19.5v-4A1.5 1.5 0 0 1 4.5 14z', 'M15.5 14h4a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a1.5 1.5 0 0 1-1.5-1.5v-4a1.5 1.5 0 0 1 1.5-1.5z'],
    file: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6'],
  };
  // GitHub's mark is a filled shape, unlike the outlined icons above.
  const GITHUB_ICON = 'M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z';
  const root = document.getElementById('root');
  // Set from the host's answer to ui/initialize.
  let canRunTools = false;
  let canUpdateModelContext = false;

  // --- JSON-RPC over postMessage, to the host only ---------------------------
  let nextId = 1;
  const pending = new Map();
  const send = message => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
  const notify = (method, params) => send({ method, params });
  function request(method, params) {
    const id = nextId++;
    send({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.method === undefined && pending.has(message.id)) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(new Error(message.error.message || 'Request failed'));
      else resolve(message.result);
      return;
    }
    if (message.method === 'ui/notifications/tool-result') render(message.params);
    else if (message.method === 'ui/notifications/host-context-changed') applyHostContext(message.params);
    else if (message.id !== undefined && (message.method === 'ui/resource-teardown' || message.method === 'ping')) send({ id: message.id, result: {} });
  });

  // --- Host theme and size ---------------------------------------------------
  function applyHostCapabilities(capabilities) {
    canRunTools = !!(capabilities && capabilities.serverTools);
    canUpdateModelContext = !!(capabilities && capabilities.updateModelContext);
  }

  function applyHostContext(context) {
    if (!context || typeof context !== 'object') return;
    const style = document.documentElement.style;
    if (context.theme === 'light' || context.theme === 'dark') style.colorScheme = context.theme;
    const variables = context.styles && context.styles.variables;
    if (variables && typeof variables === 'object') {
      for (const [name, value] of Object.entries(variables)) {
        if (name.startsWith('--') && typeof value === 'string') style.setProperty(name, value);
      }
    }
  }

  let lastHeight = 0;
  function reportSize() {
    // The body, not the page: a page is never shorter than its frame, so a card
    // that got shorter would keep the empty space.
    const height = Math.ceil(document.body.getBoundingClientRect().height);
    if (height && height !== lastHeight) {
      lastHeight = height;
      notify('ui/notifications/size-changed', { height });
    }
  }
  if (typeof ResizeObserver === 'function') new ResizeObserver(reportSize).observe(document.body);

  // --- Rendering: text only, never HTML ---------------------------------------
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null && text !== '') node.textContent = String(text);
    return node;
  }

  // Only plain web links are opened, and only through the host.
  function safeUrl(value) {
    return typeof value === 'string' && /^https?:\/\//i.test(value.trim()) ? value.trim() : null;
  }

  function openButton(label, url) {
    const button = el('button', 'open', label);
    button.type = 'button';
    button.addEventListener('click', () => { request('ui/open-link', { url }).catch(() => {}); });
    return button;
  }

  function isDone(card) {
    const meta = card.metadata || {};
    return meta.completed === true || ['done', 'watched', 'skimmed'].includes(meta.status)
      || (card.type === 'work' && meta.total > 0 && meta.done === meta.total);
  }

  // A work card's checklist is its content: without it the card shows only
  // "1/3 items done". Long lists are cut short like the body is.
  const CHECKLIST_LIMIT = 8;
  function renderChecklist(card) {
    const items = card.type === 'work' && card.metadata && Array.isArray(card.metadata.items) ? card.metadata.items : [];
    if (!items.length) return null;
    const list = el('ul', 'checklist');
    list.setAttribute('aria-label', 'Checklist');
    for (const entry of items.slice(0, CHECKLIST_LIMIT)) {
      const done = !!(entry && typeof entry === 'object' && (entry.completed || entry.done || entry.checked));
      const text = entry && typeof entry === 'object' ? entry.text : entry;
      const line = el('li', '', `${done ? '\u2611' : '\u2610'} ${text == null ? '' : String(text)}`);
      line.setAttribute('data-done', String(done));
      list.appendChild(line);
    }
    if (items.length > CHECKLIST_LIMIT) list.appendChild(el('li', '', `…and ${items.length - CHECKLIST_LIMIT} more`));
    return list;
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function typeTile(type) {
    const tile = el('span', `tile tile-${type}`);
    tile.setAttribute('aria-hidden', 'true');
    const svg = document.createElementNS(SVG_NS, 'svg');
    const filled = type === 'kanban';
    const attributes = { width: 16, height: 16, viewBox: '0 0 24 24', fill: filled ? 'currentColor' : 'none', stroke: filled ? 'none' : 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
    for (const [name, value] of Object.entries(attributes)) svg.setAttribute(name, value);
    for (const data of filled ? [GITHUB_ICON] : TYPE_ICONS[type] || TYPE_ICONS.file) {
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', data);
      svg.appendChild(path);
    }
    tile.appendChild(svg);
    return tile;
  }

  // "Added 3 Nov \u00b7 From Claude", as far as the card knows either.
  function addedLine(card) {
    const date = card.created_at ? new Date(card.created_at) : null;
    const parts = [];
    if (date && !Number.isNaN(date.getTime())) parts.push(`Added ${date.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}`);
    if (card.saved_from) parts.push(`From ${card.saved_from}`);
    return parts.join(' \u00b7 ');
  }

  function renderCard(card) {
    const item = el('li', 'card');
    fillCard(item, card);
    return item;
  }

  // A choice (see offerChoice) takes the place of the card's buttons until
  // it's answered or cancelled.
  function fillCard(item, card, notice, choice) {
    item.replaceChildren();
    if (card.just_saved) item.appendChild(el('p', 'saved-note', '\u2713 Saved to Cardlake'));
    const label = TYPE_LABELS[card.type] || 'Card';
    const meta = el('div', 'meta');
    meta.appendChild(el('span', 'type', card.subtitle ? `${label}: ${card.subtitle}` : label));
    const badges = [];
    if (card.pinned_at) badges.push('Pinned');
    if (card.liked_at) badges.push('Liked');
    if (isSnoozed(card)) badges.push('Snoozed');
    if (isDone(card)) badges.push('Done');
    for (const badge of badges) meta.appendChild(el('span', 'badge', badge));
    const heading = el('div', 'heading');
    heading.appendChild(meta);
    heading.appendChild(el('p', 'title', card.title || 'Untitled'));
    const added = addedLine(card);
    if (added) heading.appendChild(el('p', 'added', added));
    const top = el('div', 'top');
    top.appendChild(typeTile(card.type));
    top.appendChild(heading);
    item.appendChild(top);
    if (card.body) {
      const body = String(card.body);
      item.appendChild(el('p', 'body', body.length > BODY_LIMIT ? `${body.slice(0, BODY_LIMIT)}…` : body));
    }
    const checklist = renderChecklist(card);
    if (checklist) item.appendChild(checklist);
    if (choice) {
      item.appendChild(renderChoice(item, card, choice));
      return;
    }
    const actions = el('div', 'actions');
    if (canRunTools && card.id && card.type && card.just_saved) {
      if (DELETE_TOOLS[card.type]) actions.appendChild(plainButton('Undo', () => undoSave(item, card)));
    } else if (canRunTools && card.id && card.type) {
      for (const kind of ['pin', 'like']) actions.appendChild(actionButton(item, card, kind));
      const later = remindLaterButton(item, card);
      if (later) actions.appendChild(later);
      if (DELETE_TOOLS[card.type]) actions.appendChild(plainButton('Delete', () => askToDelete(item, card), 'action danger'));
    }
    const url = safeUrl(card.metadata && (card.metadata.url || card.metadata.external_url));
    if (url) actions.appendChild(openButton('Open link ↗', url));
    if (actions.children.length) item.appendChild(actions);
    if (notice) item.appendChild(el('p', 'notice', notice));
  }

  function plainButton(label, onClick, className = 'action') {
    const button = el('button', className, label);
    button.type = 'button';
    button.addEventListener('click', onClick);
    return button;
  }

  // --- Pin and like, run by the host on Cardlake's server ------------------------
  const ACTIONS = {
    pin: { field: 'pinned_at', on: { label: 'Pin', tool: 'pin_card', verb: 'pin', done: 'pinned' }, off: { label: 'Unpin', tool: 'unpin_card', verb: 'unpin', done: 'unpinned' } },
    like: { field: 'liked_at', on: { label: 'Like', tool: 'like_card', verb: 'like', done: 'liked' }, off: { label: 'Unlike', tool: 'unlike_card', verb: 'unlike', done: 'unliked' } },
  };
  const changes = [];

  function actionButton(item, card, kind) {
    const { field, on, off } = ACTIONS[kind];
    const isSet = !!card[field];
    const step = isSet ? off : on;
    const button = plainButton(step.label, () => runAction(item, card, step));
    button.setAttribute('aria-pressed', String(isSet));
    return button;
  }

  // --- Remind later (snooze) ---------------------------------------------------
  // The feed's snooze takes a number of days, so the button offers a few.
  const SNOOZE_CHOICES = [{ label: '1 day', days: 1 }, { label: '3 days', days: 3 }, { label: '1 week', days: 7 }];
  const UNSNOOZE = { tool: 'unsnooze_card', verb: 'bring back', done: 'brought back' };

  function isSnoozed(card) {
    return !!card.remind_later_until && new Date(card.remind_later_until) > new Date();
  }

  // Finished cards aren't in the feed, and Cardlake refuses to snooze them.
  function remindLaterButton(item, card) {
    if (isSnoozed(card)) return plainButton('Bring back now', () => runAction(item, card, UNSNOOZE));
    if (isDone(card)) return null;
    return plainButton('Remind later', () => offerChoice(item, card, 'Remind me in', SNOOZE_CHOICES.map(choice => ({
      label: choice.label,
      run: () => runAction(item, card, { tool: 'snooze_card', verb: 'snooze', done: 'snoozed', detail: ` for ${choice.label}`, args: { days: choice.days } }),
    }))));
  }

  // --- Delete, after asking on the card -----------------------------------------
  // GitHub issues and standalone files have no delete tool: issues belong to
  // GitHub, and files are removed in the Cardlake web app.
  const DELETE_TOOLS = {
    reminder: 'delete_reminder', learning: 'delete_learning', work: 'delete_work_item',
    family: 'delete_family_update', bookmark: 'delete_bookmark', talking_point: 'delete_talking_point',
  };

  function askToDelete(item, card) {
    offerChoice(item, card, "Delete this card? It can't be restored from the app.", [{
      label: 'Delete',
      className: 'action danger',
      run: () => runAction(item, card, { tool: DELETE_TOOLS[card.type], verb: 'delete', done: 'deleted', args: { id: card.id }, deletes: true }),
    }]);
  }

  function undoSave(item, card) {
    runAction(item, card, { tool: DELETE_TOOLS[card.type], verb: 'remove', done: 'removed', gone: 'Removed', detail: ' right after saving it', args: { id: card.id }, deletes: true });
  }

  // Swaps the card's buttons for a question and its answers, plus Cancel,
  // which puts the card back as it was.
  function offerChoice(item, card, question, choices) {
    fillCard(item, card, null, { question, choices });
    reportSize();
  }

  function renderChoice(item, card, { question, choices }) {
    const row = el('div', 'choice');
    row.appendChild(el('span', 'prompt', question));
    for (const choice of choices) row.appendChild(plainButton(choice.label, choice.run, choice.className));
    row.appendChild(plainButton('Cancel', () => { fillCard(item, card); reportSize(); }));
    return row;
  }

  function errorText(result, step) {
    const text = result && Array.isArray(result.content) && result.content[0] && result.content[0].text;
    return typeof text === 'string' && text.trim()
      ? text.replace(/^Error:\s*/, '').slice(0, 200)
      : `Couldn't ${step.verb} this card.`;
  }

  function runAction(item, card, step) {
    for (const button of actionButtonsIn(item)) button.disabled = true;
    // Feed actions name the card by type and id; delete tools take only its id.
    const args = step.deletes ? step.args : { card_type: card.type, card_id: card.id, ...step.args };
    request('tools/call', { name: step.tool, arguments: args }).then(result => {
      if (!result || result.isError) return fillCard(item, card, errorText(result, step));
      if (step.deletes) return showDeleted(item, card, step);
      const state = result.structuredContent || {};
      if ('pinned_at' in state) card.pinned_at = state.pinned_at;
      if ('liked_at' in state) card.liked_at = state.liked_at;
      if ('snoozed_until' in state) card.remind_later_until = state.snoozed_until;
      fillCard(item, card);
      tellModel(card, step);
      reportSize();
    }, () => fillCard(item, card, `Couldn't ${step.verb} this card here. Ask the assistant instead.`));
  }

  function actionButtonsIn(item) {
    const found = [];
    const walk = node => {
      for (const child of node.children || []) {
        if (child.tagName === 'BUTTON' && child.className.split(' ').includes('action')) found.push(child);
        walk(child);
      }
    };
    walk(item);
    return found;
  }

  // A deleted card is gone from Cardlake, so nothing on it can be clicked.
  function showDeleted(item, card, step) {
    item.replaceChildren();
    item.setAttribute('data-deleted', 'true');
    item.appendChild(el('p', 'notice', `${step.gone || 'Deleted'} "${card.title || 'Untitled'}".`));
    tellModel(card, step);
    reportSize();
  }

  // Keeps the model's picture current: it saw the cards before the user
  // changed them here. Each update replaces the last, so it lists every change.
  function tellModel(card, step) {
    const label = TYPE_LABELS[card.type] || 'card';
    const noun = label === 'GitHub issue' ? label : label.toLowerCase();
    changes.push(`The user ${step.done} the ${noun} "${card.title || 'Untitled'}" (${card.type} ${card.id})${step.detail || ''} in the Cardlake card view.`);
    if (!canUpdateModelContext) return;
    request('ui/update-model-context', { content: [{ type: 'text', text: changes.join('\n') }] }).catch(() => {});
  }

  // Reopening a chat replays its results, perhaps long after the card was saved
  // and edited. An older saved card is an ordinary card, whose Delete asks first.
  const UNDO_MINUTES = 10;
  function isJustSaved(data) {
    return data.saved === true && Date.now() - new Date(data.card.created_at).getTime() < UNDO_MINUTES * 60000;
  }

  function cardsFrom(result) {
    const data = result && result.structuredContent;
    if (!data || typeof data !== 'object') return null;
    if (Array.isArray(data.cards)) return { cards: data.cards, total: data.total, more: !!data.next_cursor };
    if (data.card && typeof data.card === 'object') {
      return { cards: [isJustSaved(data) ? { ...data.card, just_saved: true } : data.card], total: 1, more: false };
    }
    return null;
  }

  function render(result) {
    const view = [];
    const found = cardsFrom(result);
    if (!result || result.isError || !found) {
      view.push(el('p', 'empty', "Couldn't show these cards here."));
    } else if (!found.cards.length) {
      view.push(el('p', 'empty', 'No cards.'));
    } else {
      const count = typeof found.total === 'number' ? found.total : found.cards.length;
      if (found.cards.length > 1 || count > 1) {
        view.push(el('p', 'summary', count > found.cards.length
          ? `Showing ${found.cards.length} of ${count} cards`
          : `${found.cards.length} ${found.cards.length === 1 ? 'card' : 'cards'}${found.more ? ' (more in Cardlake)' : ''}`));
      }
      const list = el('ul', 'cards');
      for (const card of found.cards) if (card && typeof card === 'object') list.appendChild(renderCard(card));
      view.push(list);
    }
    const footer = el('p', 'footer');
    footer.appendChild(openButton('Open Cardlake ↗', CARDLE_URL));
    view.push(footer);
    root.replaceChildren(...view);
    reportSize();
  }

  // --- Handshake -------------------------------------------------------------
  request('ui/initialize', {
    appInfo: { name: 'cardle-cards', version: '1.0.0' },
    appCapabilities: { availableDisplayModes: ['inline'] },
    protocolVersion: PROTOCOL_VERSION,
  }).then(result => {
    applyHostCapabilities(result && result.hostCapabilities);
    applyHostContext(result && result.hostContext);
  }, () => {})
    .then(() => { notify('ui/notifications/initialized', {}); reportSize(); });
})();
</script>
</body>
</html>
