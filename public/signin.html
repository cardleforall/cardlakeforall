<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in to Cardlake</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/account.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark"><svg width="16" height="16" viewBox="-0.5 1.3 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="18" rx="2" transform="rotate(-8 10 14)"></rect><rect x="7" y="3" width="14" height="18" rx="2"></rect></svg></span>Cardlake</a></header>
<main class="panel">
  <h1 style="margin-top:0">Sign in</h1>
  <form id="signin-form">
    <label>Email <input type="email" name="email" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn">Sign in</button>
    <p class="error" id="error" aria-live="polite"></p>
  </form>
  <p class="fine">Forgot your password? Follow "How to reopen setup" on <a href="/setup">the setup page</a> to choose a new one. You keep all your cards.</p>
</main>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  // Only a page on this site: never send someone on to another one. Resolve
  // ?next= the way the browser will (it drops tabs and newlines, so
  // "/<tab>/evil.example" means "//evil.example") and keep it only if it
  // stays on this origin.
  function safeNext(requested) {
    const fallback = '/vault/index.html';
    if (!requested || requested[0] !== '/') return fallback;
    try {
      const url = new URL(requested, location.origin);
      return url.origin === location.origin ? url.pathname + url.search + url.hash : fallback;
    } catch (_) {
      return fallback;
    }
  }
  const next = safeNext(new URLSearchParams(location.search).get('next') || '');

  async function api(path, options = {}) {
    const res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...options });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { const error = new Error(body.error || 'Sign-in failed'); error.code = body.code; throw error; }
    return body;
  }

  // Nobody owns this Cardlake yet: there is nothing to sign in to.
  api('/api/auth/config').then(config => { if (config.setupNeeded) location.replace('/setup'); }).catch(() => {});

  $('signin-form').addEventListener('submit', async event => {
    event.preventDefault();
    const form = new FormData(event.target);
    const button = event.target.querySelector('button');
    $('error').textContent = '';
    button.disabled = true;
    try {
      await api('/api/auth/sign-in', { method: 'POST', body: JSON.stringify({ email: form.get('email'), password: form.get('password') }) });
      location.replace(next);
    } catch (error) {
      $('error').textContent = error.message;
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
