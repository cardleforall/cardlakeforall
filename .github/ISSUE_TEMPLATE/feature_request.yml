name: Feature request
description: Suggest an idea for Cardlake
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that Cardlake doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help -- screenshots, links, related issues.
